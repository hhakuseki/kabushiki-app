<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>株式分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light;--p:#007AFF;--g:#34C759;--r:#FF3B30;--o:#FF9500;--y:#FFCC00;--pu:#5856D6;--bg:#F2F2F7;--c:#FFF;--t:#000;--t2:#3C3C43;--t3:#6C6C70;--sep:#C6C6C8;--sep2:#E5E5EA;--nh:56px;--tb:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--t);max-width:430px;margin:0 auto;min-height:100vh}
.nav{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--nh);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--sep2);display:flex;align-items:center;padding:0 16px;z-index:100;padding-top:env(safe-area-inset-top)}
.nav h1{font-size:17px;font-weight:600;flex:1;text-align:center}
.nav-side{width:36px;display:flex;justify-content:flex-end}
.nav-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--p);padding:4px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--tb);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid var(--sep2);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;font-size:10px;color:var(--t3);cursor:pointer;padding-top:6px}
.tab-btn.active{color:var(--p)}
.tab-btn svg{width:24px;height:24px}
.content{padding-top:calc(var(--nh) + env(safe-area-inset-top));padding-bottom:calc(var(--tb) + 16px)}
.page{display:none;padding:0 0 16px}
.page.active{display:block}
.card{background:var(--c);border-radius:12px;margin:12px 16px 0;overflow:hidden}
.card-hdr{padding:12px 16px 8px;font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.card-hdr span{flex:1}
.card-hdr-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t3);line-height:1;padding:0 2px}
.search-wrap{padding:12px 16px 0}
.search-row{display:flex;gap:8px}
.search-inp{flex:1;height:44px;border:1.5px solid var(--sep);border-radius:10px;padding:0 12px;font-size:16px;background:var(--c);outline:none}
.search-inp:focus{border-color:var(--p)}
.search-btn{height:44px;padding:0 18px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
/* Search history */
.hist-wrap{padding:8px 16px 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hist-chip{display:flex;align-items:center;gap:4px;background:var(--sep2);border-radius:20px;padding:4px 10px;font-size:13px;cursor:pointer;border:none}
.hist-chip:active{opacity:.7}
.hist-code{font-weight:600;color:var(--t)}
.hist-name-s{font-size:11px;color:var(--t3);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-clr{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;margin-left:4px;padding:4px 6px}
/* PO */
.po-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--sep2)}
.po-box{background:var(--c);padding:12px 8px;text-align:center}
.po-box .lbl{font-size:11px;color:var(--t3);margin-bottom:4px}
.po-num{font-size:30px;font-weight:700;line-height:1}
.po-denom{font-size:13px;color:var(--t3)}
.po-badge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-perfect{background:#E3F9E5;color:#166534}.b-good{background:#DBEAFE;color:#1D4ED8}
.b-mid{background:#FEF3C7;color:#92400E}.b-low{background:#FEE2E2;color:#991B1B}
.pairs-wrap{padding:4px 16px 12px}
.pair-row{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--sep2)}
.pair-row:last-child{border:none}
.pair-lbl{font-size:13px;font-weight:500;flex:1}
.pair-vals{font-size:11px;color:var(--t3);margin-right:8px}
.pair-icon{font-size:15px;width:22px;text-align:center}
/* Chart */
.chart-tabs{display:flex;margin:8px 16px 0;border-radius:8px;background:var(--sep2);padding:2px}
.ct{flex:1;padding:5px;text-align:center;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--t3)}
.ct.active{background:var(--c);color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chart-section{display:none}
.chart-section.vis{display:block}
.chart-wrap{padding:0 8px 4px}
.chart-sub-lbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;padding:8px 16px 2px}
canvas{width:100%!important}
/* Chart expand */
.chart-wrap{position:relative}
.chart-exp{position:absolute;top:6px;right:14px;background:rgba(0,0,0,.18);border:none;border-radius:5px;color:#fff;font-size:13px;padding:2px 6px;cursor:pointer;z-index:2;line-height:1.4}
/* Img overlay */
#imgOv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:12px}
#imgOv img{max-width:100%;max-height:88vh;border-radius:8px;object-fit:contain}
#imgOv p{color:rgba(255,255,255,.45);font-size:12px}
.ma-legend{display:flex;flex-wrap:wrap;gap:4px 10px;padding:4px 16px 4px}
.ma-li{display:flex;align-items:center;gap:4px;font-size:11px}
.ma-dot{width:14px;height:3px;border-radius:2px}
/* Hero */
.hero{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:8px}
.hero-info{flex:1}
.hero-name{font-size:18px;font-weight:700;line-height:1.2}
.hero-code{font-size:13px;color:var(--t3);margin-top:2px}
.hero-price{text-align:right}
.hero-priceval{font-size:26px;font-weight:700}
.hero-yen{font-size:13px;color:var(--t3)}
/* Signals */
.sig-list{padding:6px 16px 12px}
.sig-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--sep2)}
.sig-item:last-child{border:none}
.sig-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sd-bull{background:var(--g)}.sd-bear{background:var(--r)}.sd-warn{background:var(--o)}
.sig-txt{font-size:14px}
/* Fundamentals */
.fund-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--sep2)}
.fund-item{background:var(--c);padding:12px 16px}
.fund-lbl{font-size:11px;color:var(--t3);margin-bottom:2px}
.fund-val{font-size:17px;font-weight:600}
.earn-alert{margin:12px 16px 0;background:#FFF7ED;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;border:1px solid #FED7AA}
.earn-icon{font-size:22px}
.earn-msg{font-size:14px;font-weight:500;color:#92400E}
/* Watchlist */
.wl-tabs{display:flex;overflow-x:auto;padding:10px 16px 0;gap:6px;scrollbar-width:none}
.wl-tabs::-webkit-scrollbar{display:none}
.wl-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;background:var(--sep2);color:var(--t2);display:flex;align-items:center;gap:5px;border:none}
.wl-tab.active{background:var(--p);color:#fff}
.wl-tab-edit{font-size:13px;opacity:.75;background:none;border:none;color:inherit;cursor:pointer;padding:0;line-height:1}
.wl-tab-add{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--sep2);border:none;font-size:20px;cursor:pointer;color:var(--t2);display:flex;align-items:center;justify-content:center;line-height:1}
.wl-row{display:flex;gap:8px;padding:10px 16px 0}
.wl-inp{flex:1;height:40px;border:1.5px solid var(--sep);border-radius:10px;padding:0 12px;font-size:15px;background:var(--c);outline:none}
.wl-inp:focus{border-color:var(--p)}
.wl-add{height:40px;padding:0 14px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.wl-item{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--sep2)}
.wl-item:last-child{border:none}
.wl-code{font-size:15px;font-weight:700;width:52px}
.wl-name{font-size:13px;color:var(--t3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-scores{display:flex;gap:5px;align-items:center}
.score-chip{padding:2px 7px;border-radius:6px;font-size:12px;font-weight:700}
.wl-del{color:var(--r);font-size:22px;padding:0 2px;background:none;border:none;cursor:pointer;line-height:1}
.wl-go{height:30px;padding:0 10px;background:var(--sep2);border:none;border-radius:7px;font-size:12px;color:var(--p);font-weight:600;cursor:pointer}
.s5{background:#D1FAE5;color:#065F46}.s4{background:#DBEAFE;color:#1E40AF}
.s3{background:#FEF3C7;color:#92400E}.s2,.s1,.s0{background:#FEE2E2;color:#991B1B}
/* Spinner */
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--sep2);border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty{padding:48px 24px;text-align:center;color:var(--t3)}
.empty-ico{font-size:46px;margin-bottom:10px}
.empty p{font-size:15px;line-height:1.5}
/* Screener */
.sc-ctrl{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-lbl{font-size:13px;color:var(--t3);white-space:nowrap}
.sc-sel{height:36px;padding:0 8px;border:1.5px solid var(--sep);border-radius:8px;font-size:13px;background:var(--c)}
.sc-run{height:36px;padding:0 16px;background:var(--p);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-left:auto}
.sc-item{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--sep2);cursor:pointer}
.sc-item:active{background:var(--sep2)}
.sc-code{font-size:14px;font-weight:700;width:54px}
.sc-name{font-size:13px;color:var(--t3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-wl-btn{height:28px;padding:0 9px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--sep2);color:var(--p)}
.sc-wl-btn.added{background:#D1FAE5;color:#065F46}
/* Settings */
.set-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none}
.set-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--c);border-radius:18px 18px 0 0;z-index:201;padding:16px 16px calc(env(safe-area-inset-bottom)+20px);max-height:88vh;overflow-y:auto;display:none}
.set-panel-hdr{display:flex;align-items:center;margin-bottom:14px}
.set-panel-title{font-size:17px;font-weight:700;flex:1}
.set-close{background:none;border:none;font-size:26px;color:var(--t3);cursor:pointer;line-height:1}
.set-section-lbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
.set-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--sep2)}
.set-row:last-child{border:none}
.set-row-lbl{font-size:13px;font-weight:500;min-width:58px}
.set-color{width:38px;height:30px;border:none;border-radius:7px;cursor:pointer;padding:2px;background:none}
.set-range{flex:1;height:4px;accent-color:var(--p)}
.set-val{font-size:12px;color:var(--t3);min-width:26px;text-align:right}
.set-reset{width:100%;height:44px;background:var(--r);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;margin-top:16px;cursor:pointer}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-side" style="justify-content:flex-start"></div>
  <h1 id="navTitle">株式分析</h1>
  <div class="nav-side">
    <button class="nav-btn" id="settingsBtn" style="display:none" onclick="openSettings()">⚙️</button>
  </div>
</div>

<div class="content">
  <!-- 分析 -->
  <div class="page active" id="page-analyze">
    <div class="search-wrap">
      <div class="search-row">
        <input class="search-inp" id="codeInp" type="text" autocapitalize="characters" placeholder="銘柄コード or ティッカー（例: 7203, AAPL）">
        <button class="search-btn" onclick="doAnalyze()">分析</button>
      </div>
    </div>
    <div id="searchHistory"></div>
    <div id="analyzeResult"></div>
  </div>

  <!-- ウォッチリスト -->
  <div class="page" id="page-watch">
    <div id="wlTabs" class="wl-tabs"></div>
    <div class="wl-row">
      <input class="wl-inp" id="wlInp" type="text" autocapitalize="characters" placeholder="銘柄コード or ティッカーを追加">
      <button class="wl-add" onclick="wlAdd()">追加</button>
    </div>
    <div class="card" style="margin-top:12px"><div id="wlList"></div></div>
    <div style="padding:12px 16px 0">
      <button class="search-btn" style="width:100%;background:var(--t2)" onclick="wlRefreshAll()">📊 全銘柄スコアを更新</button>
    </div>
  </div>

  <!-- スクリーナー -->
  <div class="page" id="page-screen">
    <div class="sc-ctrl">
      <span class="sc-lbl">週足≥</span>
      <select class="sc-sel" id="scW"><option value="5">5(完璧)</option><option value="4" selected>4</option><option value="3">3</option></select>
      <span class="sc-lbl">月足≥</span>
      <select class="sc-sel" id="scM"><option value="5">5(完璧)</option><option value="4">4</option><option value="3" selected>3</option></select>
      <button class="sc-run" onclick="doScreen()">実行</button>
    </div>
    <div class="card">
      <div id="screenResult">
        <div class="empty"><div class="empty-ico">🔍</div><p>条件を設定して「実行」<br><small>日経225主要約220銘柄をスキャン（約30秒）</small></p></div>
      </div>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="analyze" onclick="switchTab(this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>分析
  </button>
  <button class="tab-btn" data-tab="watch" onclick="switchTab(this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>ウォッチ
  </button>
  <button class="tab-btn" data-tab="screen" onclick="switchTab(this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/></svg>スクリーナー
  </button>
</div>

<!-- Image expand overlay -->
<div id="imgOv" onclick="this.style.display='none'">
  <img id="imgOvImg" src="" alt="">
  <p>タップして閉じる</p>
</div>

<!-- Settings overlay -->
<div class="set-overlay" id="setOverlay" onclick="closeSettings()"></div>
<div class="set-panel" id="setPanel">
  <div class="set-panel-hdr">
    <span class="set-panel-title">チャートカスタマイズ</span>
    <button class="set-close" onclick="closeSettings()">×</button>
  </div>
  <div class="set-section-lbl">価格・出来高</div>
  <div class="set-row">
    <span class="set-row-lbl">価格ライン</span>
    <input type="color" class="set-color" id="s_pc" oninput="S.pc=this.value;saveS();redraw()">
    <span style="font-size:12px;color:var(--t3)">太さ</span>
    <input type="range" class="set-range" id="s_pw" min="0.5" max="4" step="0.5" oninput="S.pw=+this.value;document.getElementById('s_pw_v').textContent=this.value;saveS();redraw()">
    <span class="set-val" id="s_pw_v">1.5</span>
  </div>
  <div class="set-row">
    <span class="set-row-lbl">出来高バー</span>
    <input type="color" class="set-color" id="s_vc" oninput="S.vch=this.value;saveS();redraw()">
  </div>
  <div class="set-section-lbl">移動平均線</div>
  <div id="maSetRows"></div>
  <button class="set-reset" onclick="resetSettings()">リセット</button>
</div>

<script>
// ══ Settings ══════════════════════════════════════════════
const DEFAULT_S={
  pc:'#1C1C1E',pw:1.5,vch:'#3478F6',
  mc:{5:'#FF3B30',10:'#FF9500',20:'#D97706',50:'#34C759',100:'#5856D6',200:'#007AFF'},
  mw:{5:1.5,10:1.5,20:1.5,50:1.5,100:1.5,200:1.5}
};
let S=JSON.parse(JSON.stringify(DEFAULT_S));
try{
  const raw=JSON.parse(localStorage.getItem('kab_s')||'null');
  if(raw){S.pc=raw.pc||S.pc;S.pw=raw.pw||S.pw;S.vch=raw.vch||S.vch;
    if(raw.mc)Object.assign(S.mc,raw.mc);if(raw.mw)Object.assign(S.mw,raw.mw);}
}catch(e){}
function saveS(){localStorage.setItem('kab_s',JSON.stringify(S));}

// Build MA rows in settings
(()=>{
  const el=document.getElementById('maSetRows');
  el.innerHTML=[5,10,20,50,100,200].map(p=>`
  <div class="set-row">
    <span class="set-row-lbl">MA${p}</span>
    <input type="color" class="set-color" id="s_mc_${p}" oninput="S.mc[${p}]=this.value;saveS();redraw()">
    <span style="font-size:12px;color:var(--t3)">太さ</span>
    <input type="range" class="set-range" id="s_mw_${p}" min="0.5" max="4" step="0.5" oninput="S.mw[${p}]=+this.value;document.getElementById('s_mw_${p}_v').textContent=this.value;saveS();redraw()">
    <span class="set-val" id="s_mw_${p}_v">${S.mw[p]}</span>
  </div>`).join('');
})();

function openSettings(){
  document.getElementById('s_pc').value=S.pc;
  document.getElementById('s_pw').value=S.pw;
  document.getElementById('s_pw_v').textContent=S.pw;
  document.getElementById('s_vc').value=S.vch;
  [5,10,20,50,100,200].forEach(p=>{
    document.getElementById(`s_mc_${p}`).value=S.mc[p];
    document.getElementById(`s_mw_${p}`).value=S.mw[p];
    document.getElementById(`s_mw_${p}_v`).textContent=S.mw[p];
  });
  document.getElementById('setOverlay').style.display='block';
  document.getElementById('setPanel').style.display='block';
}
function closeSettings(){
  document.getElementById('setOverlay').style.display='none';
  document.getElementById('setPanel').style.display='none';
}
function resetSettings(){S=JSON.parse(JSON.stringify(DEFAULT_S));saveS();openSettings();redraw();}
let _rdT=null;
function redraw(){
  clearTimeout(_rdT);
  _rdT=setTimeout(()=>{
    if(!currentData||!currentCType)return;
    const btn=document.querySelector(`.ct[data-t="${currentCType}"]`);
    if(btn)switchCT(btn);
  },120);
}

// ══ Proxies & Fetch ════════════════════════════════════════
const PROXIES=[
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];
let _pi=0;
// Sequential: for screener bulk fetches (avoid rate-limit overload)
async function proxyFetch(url,timeout=2000){
  for(let i=0;i<PROXIES.length;i++){
    const pf=PROXIES[(_pi+i)%PROXIES.length];
    try{
      const r=await fetch(pf(url),{signal:AbortSignal.timeout(timeout)});
      if(r.ok){_pi=(_pi+i)%PROXIES.length;return r;}
    }catch(e){}
  }
  throw new Error('通信エラー');
}
// Parallel race: for individual analysis — returns as soon as any proxy responds
async function proxyRace(url,timeout=3000){
  return Promise.any(
    PROXIES.map(pf=>fetch(pf(url),{signal:AbortSignal.timeout(timeout)}).then(r=>{if(!r.ok)throw 0;return r;}))
  ).catch(()=>{throw new Error('通信エラー');});
}

const YFQ='https://query1.finance.yahoo.com';
const YFQ2='https://query2.finance.yahoo.com';
const MA_PERIODS=[5,10,20,50,100,200];

// Chart instances

let searchHistory=JSON.parse(localStorage.getItem('kab_hist')||'[]');

  searchHistory=searchHistory.filter(h=>h.code!==code);
  searchHistory.unshift({code,name:name||code});
  if(searchHistory.length>10)searchHistory.length=10;
  localStorage.setItem('kab_hist',JSON.stringify(searchHistory));

// ══ Data Fetch ═════════════════════════════════════════════
async function fetchChart(symbol,interval,range,race=false){
  const url=`${YFQ}/v8/finance/chart/${symbol}?interval=${interval}&range=${range}&events=div`;
  const r=await (race?proxyRace(url):proxyFetch(url));
  const j=await r.json();
  const res=j.chart?.result?.[0];
  if(!res)throw new Error('データなし');
  const ts=res.timestamp||[];
  const q=res.indicators.quote[0];
  const rows=ts.map((t,i)=>({
    date:new Date(t*1000).toISOString().slice(0,10),
    o:q.open?.[i],h:q.high?.[i],l:q.low?.[i],c:q.close?.[i],v:q.volume?.[i]
  })).filter(d=>d.c!=null);
  if(!race)return rows;
  // Extract fundamental data from chart meta (used as fallback)
  const m=res.meta||{};
  return {rows,meta:{
    trailingPE:m.trailingPE??null,
    priceToBook:m.priceToBook??null,
    trailingAnnualDividendYield:m.trailingAnnualDividendYield??null,
    trailingEps:m.trailingEps??null,
  }};
}

async function fetchInfo(symbol){
  const empty={summaryDetail:{},defaultKeyStatistics:{},financialData:{},calendarEvents:{}};
  let result=JSON.parse(JSON.stringify(empty));

  // ① v7 quote — race all proxies in parallel for speed & reliability
  for(const h of[YFQ,YFQ2]){
    try{
      const r=await proxyRace(`${h}/v7/finance/quote?symbols=${symbol}&corsDomain=finance.yahoo.com&formatted=false`,3000);
      const j=await r.json();
      const q=j.quoteResponse?.result?.[0];
      if(q){
        result.summaryDetail={
          trailingPE:q.trailingPE??null,forwardPE:q.forwardPE??null,
          priceToBook:q.priceToBook??null,
          dividendYield:q.trailingAnnualDividendYield??null,
          trailingAnnualDividendYield:q.trailingAnnualDividendYield??null
        };
        result.defaultKeyStatistics={trailingEps:q.epsTrailingTwelveMonths??null};
        result.financialData={returnOnEquity:q.returnOnEquity??null};
        const ts=q.earningsTimestampStart||q.earningsTimestampEnd||null;
        if(ts)result.calendarEvents={earnings:{earningsDate:[{raw:ts}]}};
        // Return partial data even if some fields are null — better than waiting for quoteSummary
        return result;
      }
    }catch(e){}
  }

  // ② quoteSummary v10 — last resort (often blocked, short timeout)
  for(const h of[YFQ,YFQ2]){
    try{
      const url=`${h}/v10/finance/quoteSummary/${symbol}?modules=summaryDetail,defaultKeyStatistics,financialData,calendarEvents&formatted=false&corsDomain=finance.yahoo.com`;
      const r=await proxyRace(url,3000);
      const j=await r.json();
      const res=j.quoteSummary?.result?.[0];
      if(res){
        ['summaryDetail','defaultKeyStatistics','financialData'].forEach(mod=>{
          if(res[mod])for(const k in res[mod])if(res[mod][k]!=null)result[mod][k]=res[mod][k];
        });
        if(res.calendarEvents)result.calendarEvents=res.calendarEvents;
        return result;
      }
    }catch(e){}
  }
  return result;
}

function getRaw(x){return x==null?null:(typeof x==='object'?(x.raw??x):x);}

async function fetchName(symbol){
  // Try search API — returns Japanese shortname for .T stocks
  try{
    const r=await proxyRace(`${YFQ}/v1/finance/search?q=${encodeURIComponent(symbol)}&newsCount=0&quotesCount=1`,2500);
    const j=await r.json();
    const q=(j.quotes||[])[0];
    if(q){const n=q.shortname||q.longname;if(n&&n!==symbol)return n;}
  }catch(e){}
  // Fallback: chart meta (prefer shortName = JP name)
  try{
    const r=await proxyFetch(`${YFQ}/v8/finance/chart/${symbol}?interval=1d&range=5d`);
    const j=await r.json();
    const meta=j.chart?.result?.[0]?.meta;
    return meta?.shortName||meta?.longName||symbol;
  }catch(e){}
  return symbol;
}

// ══ Technicals ═════════════════════════════════════════════
function calcMA(closes,p){
  return closes.map((_,i)=>{
    if(i<p-1)return null;
    const s=closes.slice(i-p+1,i+1);
    return s.reduce((a,b)=>a+(b||0),0)/s.length;
  });
}
function calcRSI(closes,p=14){
  const rsi=new Array(closes.length).fill(null);
  for(let i=p;i<closes.length;i++){
    let g=0,l=0;
    for(let j=i-p+1;j<=i;j++){const d=closes[j]-closes[j-1];if(d>0)g+=d;else l-=d;}
    const rs=l===0?100:g/p/(l/p);
    rsi[i]=100-100/(1+rs);
  }
  return rsi;
}
function calcMACD(closes,f=12,s=26,sig=9){
  const ema=(arr,span)=>{
    const k=2/(span+1),r=new Array(arr.length).fill(null);let prev=null;
    for(let i=0;i<arr.length;i++){
      if(arr[i]==null){r[i]=null;continue;}
      r[i]=prev==null?arr[i]:arr[i]*k+prev*(1-k);prev=r[i];
    }return r;
  };
  const ef=ema(closes,f),es=ema(closes,s);
  const macd=ef.map((v,i)=>v==null||es[i]==null?null:v-es[i]);
  const signal=ema(macd,sig);
  const hist=macd.map((v,i)=>v==null||signal[i]==null?null:v-signal[i]);
  return{macd,signal,hist};
}
function perfectOrder(rows){
  const closes=rows.map(r=>r.c);
  const mas={};
  MA_PERIODS.forEach(p=>{mas[p]=calcMA(closes,p);});
  const latest={};
  MA_PERIODS.forEach(p=>{latest[p]=mas[p][mas[p].length-1];});
  const pairs=[];
  for(let i=0;i<MA_PERIODS.length-1;i++){
    const a=MA_PERIODS[i],b=MA_PERIODS[i+1];
    const va=latest[a],vb=latest[b];
    pairs.push({label:`MA${a}>MA${b}`,ok:va!=null&&vb!=null?va>vb:null,va,vb});
  }
  const score=pairs.filter(p=>p.ok===true).length;
  const avail=pairs.filter(p=>p.ok!==null).length;
  return{score,avail,is_perfect:score===5&&avail===5,pairs,ma_values:latest,price:closes[closes.length-1],mas};
}

// ══ Analysis ════════════════════════════════════════════════
async function doAnalyze(code){
  code=(code||document.getElementById('codeInp').value.trim()).toUpperCase();
  if(!code)return;
  const el=document.getElementById('analyzeResult');
  el.innerHTML='<div class="loading"><div class="spin"></div><span>データ取得中...</span></div>';
  document.getElementById('settingsBtn').style.display='none';
  try{
    const sym=/^\d{4,}$/.test(code)?code+'.T':code;
    const [d1res,w1res,m1res,info,name]=await Promise.all([
      fetchChart(sym,'1d','1y',true),
      fetchChart(sym,'1wk','3y',true),
      fetchChart(sym,'1mo','10y',true),
      fetchInfo(sym).catch(()=>({})),
      fetchName(sym).catch(()=>code)
    ]);
    const daily=d1res.rows, cMeta=d1res.meta||{};
    const weekly=w1res.rows;
    const monthly=m1res.rows;
    const d_po=perfectOrder(daily);
    const w_po=perfectOrder(weekly);
    const m_po=perfectOrder(monthly);
    const closes=daily.map(r=>r.c);
    const rsi=calcRSI(closes);
    const {macd,signal,hist}=calcMACD(closes);

    const sd0=info.summaryDetail||{};
    const sd={
      trailingPE:sd0.trailingPE??cMeta.trailingPE??null,
      forwardPE:sd0.forwardPE??null,
      priceToBook:sd0.priceToBook??cMeta.priceToBook??null,
      dividendYield:sd0.dividendYield??cMeta.trailingAnnualDividendYield??null,
      trailingAnnualDividendYield:sd0.trailingAnnualDividendYield??cMeta.trailingAnnualDividendYield??null,
    };
    const ks0=info.defaultKeyStatistics||{};
    const ks={trailingEps:ks0.trailingEps??cMeta.trailingEps??null};
    const fd=info.financialData||{};
    const cal=info.calendarEvents||{};
    let earningsDate=null,daysToEarnings=null;
    try{
      const ed=cal.earnings?.earningsDate?.[0]?.raw;
      if(ed){earningsDate=new Date(ed*1000).toISOString().slice(0,10);daysToEarnings=Math.round((ed*1000-Date.now())/86400000);}
    }catch(e){}

    const signals=[];
    const rsiLast=rsi[rsi.length-1];
    const macdLast=macd[macd.length-1],sigLast=signal[signal.length-1];
    if(w_po.score>=4)signals.push({t:'bull',txt:`週足 ${w_po.score}/5ペア 上昇基調`});
    if(m_po.score>=4)signals.push({t:'bull',txt:`月足 ${m_po.score}/5ペア 上昇基調`});
    if(rsiLast&&rsiLast<35)signals.push({t:'bull',txt:`RSI ${rsiLast.toFixed(0)} — 売られすぎ`});
    if(rsiLast&&rsiLast>70)signals.push({t:'bear',txt:`RSI ${rsiLast.toFixed(0)} — 買われすぎ`});
    if(macdLast&&sigLast)signals.push(macdLast>sigLast?{t:'bull',txt:'MACD シグナル上抜け'}:{t:'bear',txt:'MACD シグナル下抜け'});
    if(daysToEarnings!=null&&daysToEarnings>=0&&daysToEarnings<=10)
      signals.push({t:'warn',txt:`決算まで ${daysToEarnings}日 — エントリー注意`});

    // Add to search history
    addToHistory(code,name);

    currentData={code,name,daily,weekly,monthly,d_po,w_po,m_po,rsi,macd,signal,hist};
    currentCType='daily';
    renderAnalysis({code,name,price:d_po.price,d_po,w_po,m_po,signals,sd,ks,fd,earningsDate,daysToEarnings},el);
    document.getElementById('settingsBtn').style.display='block';
  }catch(e){
    el.innerHTML=`<div class="empty"><div class="empty-ico">⚠️</div><p>エラー: ${e.message}<br><small>銘柄コードを確認してください</small></p></div>`;
  }
}

function poBox(lbl,po){
  if(!po)return`<div class="po-box"><div class="lbl">${lbl}</div><div class="po-num">—</div></div>`;
  const s=po.score,cls=s===5?'b-perfect':s>=4?'b-good':s>=3?'b-mid':'b-low';
  const badge=s===5?'🎯 完璧！':s>=4?'↑ 強気':s>=3?'△ 中立':'↓ 弱気';
  return`<div class="po-box"><div class="lbl">${lbl}</div><div><span class="po-num">${s}</span><span class="po-denom">/5</span></div><div class="po-badge ${cls}">${badge}</div></div>`;
}
function pairsHtml(po){
  if(!po?.pairs)return'<div style="color:var(--t3);padding:8px">データなし</div>';
  return po.pairs.map(p=>{
    const icon=p.ok===null?'—':p.ok?'✅':'❌';
    return`<div class="pair-row"><div class="pair-lbl">${p.label.replace('MA','MA ')}</div><div class="pair-vals">${p.va?fmtN(p.va):'—'} / ${p.vb?fmtN(p.vb):'—'}</div><div class="pair-icon">${icon}</div></div>`;
  }).join('');
}

// ══ Chart Switching ═════════════════════════════════════════
function switchCT(btn){
  document.querySelectorAll('.ct').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  currentCType=btn.dataset.t;
  document.querySelectorAll('.chart-section').forEach(s=>s.classList.remove('vis'));
  const sec=document.getElementById('sec-'+currentCType);
  if(sec)sec.classList.add('vis');
  if(!currentData)return;
  destroyAll();
  switch(currentCType){
    case 'daily': drawDaily(currentData); break;
    case 'weekly': wci=drawTF(currentData.weekly,'weeklyC','maLegW'); break;
    case 'monthly': mci=drawTF(currentData.monthly,'monthlyC','maLegM'); break;
    case 'wm':
      wmwi=drawTF(currentData.weekly,'wmWC','maLegWM');
      wmmi=drawTF(currentData.monthly,'wmMC',null);
      break;
  }
}

function maLegHtml(){
  return MA_PERIODS.map(p=>`<div class="ma-li"><div class="ma-dot" style="background:${S.mc[p]};height:${Math.max(2,S.mw[p])}px"></div>MA${p}</div>`).join('');
}

function drawTF(rows,canvasId,legendId){
  const closes=rows.map(r=>r.c);
  const labels=rows.map(r=>r.date);
  const ds=[{label:'終値',data:closes,borderColor:S.pc,borderWidth:S.pw,pointRadius:0,tension:0,fill:false,order:10}];
  MA_PERIODS.forEach(p=>{
    ds.push({label:`MA${p}`,data:calcMA(closes,p),borderColor:S.mc[p],borderWidth:S.mw[p],pointRadius:0,tension:0,fill:false});
  });
  if(legendId){const leg=document.getElementById(legendId);if(leg)leg.innerHTML=maLegHtml();}
  const ctx=document.getElementById(canvasId);
  if(!ctx)return null;
  return new Chart(ctx,{type:'line',data:{labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,animation:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false}},
    scales:{
      x:{ticks:{maxTicksLimit:6,font:{size:10}},grid:{display:false}},
      y:{position:'right',ticks:{maxTicksLimit:5,font:{size:10},callback:v=>fmtN(v)},grid:{color:'#F0F0F0'}}
    }
  }});
}

function drawDaily(d){
  const rows=d.daily;
  const closes=rows.map(r=>r.c);
  const vols=rows.map(r=>r.v||0);
  const labels=rows.map(r=>r.date);

  // MA legend
  const leg=document.getElementById('maLeg');
  if(leg)leg.innerHTML=maLegHtml();

  // Price + MA
  const ctx=document.getElementById('mainC');
  if(!ctx)return;
  const ds=[{label:'終値',data:closes,borderColor:S.pc,borderWidth:S.pw,pointRadius:0,tension:0,fill:false,order:10}];
  MA_PERIODS.forEach(p=>{
    ds.push({label:`MA${p}`,data:calcMA(closes,p),borderColor:S.mc[p],borderWidth:S.mw[p],pointRadius:0,tension:0,fill:false});
  });
  ci=new Chart(ctx,{type:'line',data:{labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,animation:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false}},
    scales:{
      x:{ticks:{maxTicksLimit:6,font:{size:10}},grid:{display:false}},
      y:{position:'right',ticks:{maxTicksLimit:5,font:{size:10},callback:v=>fmtN(v)},grid:{color:'#F0F0F0'}}
    }
  }});

  // Volume
  const vc=document.getElementById('volC');
  if(vc){
    vi=new Chart(vc,{type:'bar',data:{labels,datasets:[{
      label:'出来高',data:vols,
      backgroundColor:S.vch+'99',borderWidth:0,
      barPercentage:1,categoryPercentage:1
    }]},options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{display:false},grid:{display:false}},
        y:{position:'right',ticks:{maxTicksLimit:3,font:{size:9},callback:v=>v>=1e8?`${(v/1e8).toFixed(0)}億`:v>=1e4?`${(v/1e4).toFixed(0)}万`:''},grid:{color:'#F0F0F0'}}
      }
    }});
  }

  // RSI
  const rc=document.getElementById('rsiC');
  if(rc){
    ri=new Chart(rc,{type:'line',data:{labels,datasets:[{
      label:'RSI',data:d.rsi,borderColor:'#5856D6',borderWidth:1.5,pointRadius:0,tension:0,fill:false
    }]},options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{maxTicksLimit:6,font:{size:9}},grid:{display:false}},
        y:{position:'right',min:0,max:100,ticks:{stepSize:20,font:{size:9}},
           grid:{color:c=>(c.tick.value===30||c.tick.value===70)?'#FF950080':'#F0F0F0'}}
      }
    }});
  }

  // MACD
  const mc=document.getElementById('macdC');
  if(mc){
    midi=new Chart(mc,{type:'bar',data:{labels,datasets:[
      {label:'MACD',data:d.macd,borderColor:'#007AFF',borderWidth:1.5,type:'line',pointRadius:0,tension:0,fill:false,order:1},
      {label:'Signal',data:d.signal,borderColor:'#FF3B30',borderWidth:1.5,type:'line',pointRadius:0,tension:0,fill:false,order:2},
      {label:'Hist',data:d.hist,backgroundColor:d.hist.map(v=>v>=0?'rgba(52,199,89,.5)':'rgba(255,59,48,.5)'),order:3}

      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{maxTicksLimit:6,font:{size:9}},grid:{display:false}},
        y:{position:'right',ticks:{maxTicksLimit:4,font:{size:9}},grid:{color:'#F0F0F0'}}
      }
    }});
  }
}

// ══ Watchlist ═══════════════════════════════════════════════
async function quickScore(code){
  const sym=/^\d{4,}$/.test(code)?code+'.T':code;
  const [w,m]=await Promise.all([fetchChart(sym,'1wk','5y'),fetchChart(sym,'1mo','10y')]);
  const n=await fetchName(sym).catch(()=>code);
  const wp=perfectOrder(w),mp=perfectOrder(m);
  return{code,name:n,weekly_score:wp.score,monthly_score:mp.score,price:wp.price};
}
function renderWL(){
  const el=document.getElementById('wlList');
  const list=getWL();
  if(!list.length){el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><p>銘柄を追加してください</p></div>';return;}
  el.innerHTML=list.map((w,i)=>{
    const ws=w.weekly_score??'?',ms=w.monthly_score??'?';
    return`<div class="wl-item">
      <div class="wl-code">${w.code}</div>
      <div class="wl-name">${w.name||w.code}</div>
      <div class="wl-scores">
        <span class="score-chip s${ws}">週${ws}</span>
        <span class="score-chip s${ms}">月${ms}</span>
        <button class="wl-go" onclick="jumpAnalyze('${w.code}')">分析</button>
        <button class="wl-del" onclick="wlDel(${i})">×</button>
      </div>
    </div>`;
  }).join('');
}
async function wlAdd(){
  const code=document.getElementById('wlInp').value.trim().toUpperCase();
  const list=getWL();
  if(!code||list.find(w=>w.code===code))return;
  list.push({code,name:code});saveWL();renderWL();
  document.getElementById('wlInp').value='';
  quickScore(code).then(r=>{const i=list.findIndex(w=>w.code===code);if(i>=0){Object.assign(list[i],r);saveWL();renderWL();}}).catch(()=>{});
}
function wlDel(i){getWL().splice(i,1);saveWL();renderWL();}
async function wlRefreshAll(){
  const list=getWL();
  if(!list.length)return;
  document.getElementById('wlList').innerHTML='<div class="loading"><div class="spin"></div><span>更新中...</span></div>';
  await Promise.allSettled(list.map(async(w,i)=>{const r=await quickScore(w.code).catch(()=>null);if(r)Object.assign(list[i],r);}));
  saveWL();renderWL();
}
function jumpAnalyze(code){
  document.getElementById('codeInp').value=code;
  document.querySelector('[data-tab="analyze"]').click();
  doAnalyze(code);
}

// Add to active watchlist (from screener or anywhere)
function addToActiveWL(code,name){
  const list=getWL();
  if(list.find(w=>w.code===code))return;
  list.push({code,name:name||code});saveWL();
  // Update button state in screener
  const btn=document.querySelector(`.sc-wl-btn[data-code="${code}"]`);
  if(btn){btn.textContent='✓ 追加済';btn.classList.add('added');}
  // Fetch score in background
  quickScore(code).then(r=>{const i=list.findIndex(w=>w.code===code);if(i>=0){Object.assign(list[i],r);saveWL();}}).catch(()=>{});
}
function isInWL(code){return getWL().some(w=>w.code===code);}

async function doScreen(){
  const minW=+document.getElementById('scW').value;
  const minM=+document.getElementById('scM').value;
  const el=document.getElementById('screenResult');
  const total=SCREEN_CODES.length;
  let done=0;
  const updProg=()=>{el.innerHTML=`<div class="loading"><div class="spin"></div><span>スキャン中... ${done}/${total}䊘柄</span></div>`;};
  updProg();
  const results=[];
  for(let i=0;i<SCREEN_CODES.length;i+=20){
    const batch=SCREEN_CODES.slice(i,i+20);
    await Promise.allSettled(batch.map(async code=>{
      try{
        const sym=code+'.T';
        const [w,m]=await Promise.all([
          fetchChart(sym,'1wk','5y'),
          fetchChart(sym,'1mo','10y')
        ]);
        const wp=perfectOrder(w),mp=perfectOrder(m);
        if(wp.score>=minW&&mp.score>=minM){
          const n=await fetchName(sym).catch(()=>code);
          results.push({code,name:n,ws:wp.score,ms:mp.score,price:wp.price});
        }
      }catch(e){}
      done++;updProg();
    }));
  }
  results.sort((a,b)=>(b.ws+b.ms)-(a.ws+a.ms));
  if(!results.length){el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><p>条件に合う銘柄なし</p></div>';return;}
  const listName=wlData.lists[wlData.active]?.name||'リスト';
  el.innerHTML=results.map(r=>{
    const inWL=isInWL(r.code);
    const safeName=r.name.replace(/'/g,"\\'");
    return`<div class="sc-item" onclick="jumpAnalyze('${r.code}')">
    <div class="sc-code">${r.code}</div>
    <div class="sc-name">${r.name}</div>
    <div class="sc-scores" style="display:flex;gap:5px;align-items:center">
      <span class="score-chip s${r.ws}">週${r.ws}</span>
      <span class="score-chip s${r.ms}">月${r.ms}</span>
      <button class="sc-wl-btn${inWL?' added':''}" data-code="${r.code}" onclick="addToActiveWL('${r.code}','${safeName}');event.stopPropagation()">${inWL?'✓ 追加済':'WL追加'}|/button>
    </div>
  </div>`;
  }).join('');
}

function switchTab(btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+btn.dataset.tab).classList.add('active');
  document.getElementById('navTitle').textContent={analyze:'株式分析',watch:'ウォッチリスト',screen:'スクリーナー'}[btn.dataset.tab];
  if(btn.dataset.tab!=='analyze')document.getElementById('settingsBtn').style.display='none';
  else if(currentData)document.getElementById('settingsBtn').style.display='block';
}
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function fmtN(v){
  if(v==null||isNaN(v))return'—';
  const n=Number(v);
  return n>=1000?n.toLocaleString('ja-JP',{maximumFractionDigits:0}):n.toFixed(n>=10?1:2);
}
