<style>
:root{color-scheme:light;--p:#007AFF;--g:#34C759;--r:#FF3B30;--o:#FF9500;--y:#FFCC00;--pu:#5856D6;--bg:#F2F2F7;--c:#FFF;--t:#000;--t2:#3C3C43;--t3:#6C6C70;--sep:#C6C6C8;--sep2:#E5E5EA;--nh:56px;--tb:60px}

body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--t);max-width:430px;margin:0 auto;min-height:100vh}
.nav{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--nh);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--sep2);display:flex;align-items:center;padding:0 16px;z-index:100;padding-top:env(safe-area-inset-top)}

.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;font-size:10px;color:var(--t3);cursor:pointer;padding-top:6px}

/* Spinner / Empty */

  </button>

<script>
// ── 定数 ──────────────────────────────────────────────────
const PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.org/?',
];
let _pi = 0;
async function proxyFetch(url) {
  for (let i = 0; i < PROXIES.length; i++) {
    const p = PROXIES[(_pi + i) % PROXIES.length];
    try {
      const r = await fetch(p + encodeURIComponent(url), {signal: AbortSignal.timeout(8000)});
      if (r.ok) { _pi = (_pi + i) % PROXIES.length; return r; }
    } catch(e) {}
  }
  throw new Error('通信エラー: 全プロキシ失敗');
}
const YF1   = 'https://query1.finance.yahoo.com/v8/finance/chart/';
const YF2   = 'https://query2.finance.yahoo.com/v10/finance/quoteSummary/';
const MA_PERIODS = [5,10,20,50,100,200];
const MA_COLORS  = {5:'#FF3B30',10:'#FF9500',20:'#D97706',50:'#34C759',100:'#5856D6',200:'#007AFF'};
let chartInst=null, rsiInst=null, macdInst=null;
let currentData=null, currentCType='daily';
let watchlist = JSON.parse(localStorage.getItem('kab_watch2')||'[]');

// ── Yahoo Finance データ取得 ─────────────────────────────
async function fetchChart(symbol, interval, range) {
  const url = `${YF1}${symbol}?interval=${interval}&range=${range}&events=div`;
  const r = await proxyFetch(url);
  const j = await r.json();
  const res = j.chart?.result?.[0];
  if (!res) throw new Error('データなし');
  const ts  = res.timestamp || [];
  const q   = res.indicators.quote[0];
  return ts.map((t,i) => ({
    date: new Date(t*1000).toISOString().slice(0,10),
    o: q.open?.[i], h: q.high?.[i], l: q.low?.[i], c: q.close?.[i], v: q.volume?.[i]
  })).filter(d => d.c != null);
}

async function fetchInfo(symbol) {
  // v7 quote — no crumb required, proxy-friendly
  const v7base = `?symbols=${symbol}`;
  for (const host of ['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com']) {
    try {
      const r = await proxyFetch(host + '/v7/finance/quote' + v7base);
      const j = await r.json();
      const q = j.quoteResponse?.result?.[0];
      if (q && (q.trailingPE || q.priceToBook || q.epsTrailingTwelveMonths || q.trailingAnnualDividendYield)) {
        const ts = q.earningsTimestampStart || q.earningsTimestampEnd || null;
        return {
          summaryDetail: { trailingPE: q.trailingPE, forwardPE: q.forwardPE, priceToBook: q.priceToBook,
                           dividendYield: q.trailingAnnualDividendYield, trailingAnnualDividendYield: q.trailingAnnualDividendYield },
          defaultKeyStatistics: { trailingEps: q.epsTrailingTwelveMonths },
          financialData: { returnOnEquity: q.returnOnEquity },
          calendarEvents: ts ? { earnings: { earningsDate: [{raw: ts}] } } : {}
        };
      }
    } catch(e) {}
  }
  // fallback: v11 quoteSummary
  const mods = 'summaryDetail,defaultKeyStatistics,calendarEvents,financialData';
  for (const host of ['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com']) {
    try {
      const r = await proxyFetch(`${host}/v11/finance/quoteSummary/${symbol}?modules=${mods}&formatted=false`);
      const j = await r.json();
      const res = j.quoteSummary?.result?.[0];
      if (res) return res;
    } catch(e) {}
  }
  return {};
}
function getRaw(x) { return x == null ? null : (typeof x === 'object' ? (x.raw ?? x) : x); }

async function fetchName(symbol) {
  const url = `${YF1}${symbol}?interval=1d&range=5d`;
  const r = await proxyFetch(url);
  const j = await r.json();
  const meta = j.chart?.result?.[0]?.meta;
  return meta?.longName || meta?.shortName || symbol;
}

// ── テクニカル指標 ────────────────────────────────────────
function calcMA(closes, p) {
  return closes.map((_, i) => {
    if (i < p-1) return null;
    const s = closes.slice(i-p+1, i+1);
    return s.reduce((a,b)=>a+(b||0),0)/s.length;
  });
}
function calcRSI(closes, p=14) {
  const rsi = new Array(closes.length).fill(null);
  for (let i=p; i<closes.length; i++) {
    let g=0, l=0;
    for (let j=i-p+1; j<=i; j++) {
      const d = closes[j]-closes[j-1];
      if (d>0) g+=d; else l-=d;
    }
    const rs = l===0 ? 100 : g/p/(l/p);
    rsi[i] = 100 - 100/(1+rs);
  }
  return rsi;
}
function calcMACD(closes, f=12, s=26, sig=9) {
  const ema = (arr, span) => {
    const k=2/(span+1), r=new Array(arr.length).fill(null);
    let prev=null;
    for(let i=0;i<arr.length;i++){
      if(arr[i]==null){r[i]=null;continue;}
      r[i] = prev==null ? arr[i] : arr[i]*k + prev*(1-k);
      prev = r[i];
    }
    return r;
  };
  const ef=ema(closes,f), es=ema(closes,s);
  const macd=ef.map((v,i)=>v==null||es[i]==null?null:v-es[i]);
  const signal=ema(macd, sig);
  const hist=macd.map((v,i)=>v==null||signal[i]==null?null:v-signal[i]);
  return {macd, signal, hist};
}
function perfectOrder(rows) {
  const closes = rows.map(r=>r.c);
  const mas = {};
  MA_PERIODS.forEach(p => { mas[p] = calcMA(closes, p); });
  const latest = {};
  MA_PERIODS.forEach(p => { latest[p] = mas[p][mas[p].length-1]; });
  const pairs = [];
  for(let i=0;i<MA_PERIODS.length-1;i++){
    const a=MA_PERIODS[i], b=MA_PERIODS[i+1];
    const va=latest[a], vb=latest[b];
    pairs.push({label:`MA${a}>MA${b}`, ok: va!=null&&vb!=null ? va>vb : null, va, vb});
  }
  const score = pairs.filter(p=>p.ok===true).length;
  const avail = pairs.filter(p=>p.ok!==null).length;
  return { score, avail, is_perfect: score===5&&avail===5, pairs, ma_values: latest, price: closes[closes.length-1], mas };
}

// ── 分析 ─────────────────────────────────────────────────
async function doAnalyze(code) {
  code = (code || document.getElementById('codeInp').value.trim()).toUpperCase();
  if (!code) return;
  const el = document.getElementById('analyzeResult');
  el.innerHTML = '<div class="loading"><div class="spin"></div><span>データ取得中...</span></div>';
  try {
    // 4桁数字 → 東証(.T付加)、それ以外 → 米国株等ティッカーそのまま
    const sym = /^\d{4,}$/.test(code) ? code+'.T' : code;
    const [daily, weekly, monthly, info, name] = await Promise.all([
      fetchChart(sym,'1d','1y'),
      fetchChart(sym,'1wk','5y'),
      fetchChart(sym,'1mo','15y'),
      fetchInfo(sym).catch(()=>({})),
      fetchName(sym).catch(()=>code)
    ]);
    const d_po = perfectOrder(daily);
    const w_po = perfectOrder(weekly);
    const m_po = perfectOrder(monthly);

    // RSI / MACD on daily
    const closes = daily.map(r=>r.c);
    const rsi = calcRSI(closes);
    const {macd,signal,hist} = calcMACD(closes);

    // Fundamentals
    const sd = info.summaryDetail || {};
    const ks = info.defaultKeyStatistics || {};
    const fd = info.financialData || {};
    const cal= info.calendarEvents || {};
    let earningsDate = null, daysToEarnings = null;
    try {
      const ed = cal.earnings?.earningsDate?.[0]?.raw;
      if (ed) {
        earningsDate = new Date(ed*1000).toISOString().slice(0,10);
        daysToEarnings = Math.round((ed*1000 - Date.now())/86400000);
      }
    } catch(e){}

    // Signals
    const signals=[];
    const rsiLast = rsi[rsi.length-1];
    const macdLast = macd[macd.length-1], sigLast = signal[signal.length-1];
    if(w_po.score>=4) signals.push({t:'bull',txt:`週足 ${w_po.score}/5ペア 上昇基調`});
    if(m_po.score>=4) signals.push({t:'bull',txt:`月足 ${m_po.score}/5ペア 上昇基調`});
    if(rsiLast && rsiLast<35) signals.push({t:'bull',txt:`RSI ${rsiLast.toFixed(0)} — 売られすぎ`});
    if(rsiLast && rsiLast>70) signals.push({t:'bear',txt:`RSI ${rsiLast.toFixed(0)} — 買われすぎ`});
    if(macdLast && sigLast) signals.push(macdLast>sigLast
      ? {t:'bull',txt:'MACD シグナル上抜け'} : {t:'bear',txt:'MACD シグナル下抜け'});
    if(daysToEarnings!=null && daysToEarnings>=0 && daysToEarnings<=10)
      signals.push({t:'warn',txt:`決算まで ${daysToEarnings}日 — エントリー注意`});

    currentData = {code, name, daily, weekly, d_po, w_po, m_po, rsi, macd, signal, hist};
    currentCType = 'daily';
    renderAnalysis({code, name, price:d_po.price, d_po, w_po, m_po, signals, sd, ks, fd, earningsDate, daysToEarnings, daily, weekly, rsi, macd, signal, hist}, el);
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">⚠️</div><p>エラー: ${e.message}<br><small>銘柄コードを確認してください</small></p></div>`;
  }
}

function renderAnalysis(d, el) {
  el.innerHTML='';
  const ap = v => el.appendChild(v);

  // Hero
  const hero = mk('div','card');
  hero.innerHTML = `<div class="hero"><div class="hero-info"><div class="hero-name">${d.name}</div><div class="hero-code">${d.code}</div></div><div class="hero-price"><div class="hero-priceval">${fmtN(d.price)}</div><div class="hero-yen">円</div></div></div>`;
  ap(hero);

  // Earnings alert
  if(d.daysToEarnings!=null && d.daysToEarnings>=0 && d.daysToEarnings<=14){
    const ea=mk('div','earn-alert'); ea.innerHTML=`<span class="earn-icon">📅</span><span class="earn-msg">決算まで <strong>${d.daysToEarnings}日</strong>（${d.earningsDate}）</span>`; ap(ea);
  }

  // Signals
  if(d.signals.length>0){
    const sc=mk('div','card'); sc.style.marginTop='12px';
    sc.innerHTML=`<div class="card-header">シグナル</div><div class="sig-list">${
      d.signals.map(s=>`<div class="sig-item"><div class="sig-dot sd-${s.t}"></div><div class="sig-txt">${s.txt}</div></div>`).join('')
    }</div>`; ap(sc);
  }

  // PO cards
  const poc=mk('div','card'); poc.style.marginTop='12px';
  poc.innerHTML=`<div class="card-header">パーフェクトオーダー（MA5 › MA10 › MA20 › MA50 › MA100 › MA200）</div><div class="po-grid">${poBox('日足',d.d_po)}${poBox('週足',d.w_po)}${poBox('月足',d.m_po)}</div>`; ap(poc);

  // Weekly pairs detail
  const pd=mk('div','card'); pd.style.marginTop='12px';
  pd.innerHTML<`<div class="card-header">週足 MAペア</div><div class="pairs-wrap">${pairsHtml(d.w_po)}</div>`; ap(pd);

  // Chart tabs
  const ctabs=mk('div','chart-tabs');
  ctabs.innerHTML=`<div class="ct active" data-t="daily" onclick="switchCT(this)">日足</div><div class="ct" data-t="weekly" onclick="switchCT(this)">週足</div>`;
  ap(ctabs);

  // Chart card
  const cc=mk('div','card'); cc.style.marginTop='8px'; cc.id='chartCard';
  cc.innerHTML=`<div class="card-header">移動平均線チャート</div><div class="ma-legend" id="maLeg"></div><div class="chart-wrap"><canvas id="mainC" height="220"></canvas></div><div class="chart-wrap"><canvas id="rsiC" height="85"></canvas></div><div class="chart-wrap"><canvas id="macdC" height="85"></canvas></div>`; ap(cc);

  // Fundamentals
  const per = getRaw(d.sd.trailingPE) ?? getRaw(d.sd.forwardPE);
  const pbr = getRaw(d.sd.priceToBook);
  const eps = getRaw(d.ks.trailingEps);
  const roe = getRaw(d.fd.returnOnEquity);
  const dy  = getRaw(d.sd.dividendYield) ?? getRaw(d.sd.trailingAnnualDividendYield);
  const fc=mk('div','card'); fc.style.marginTop='12px';
  fc.innerHTML=`<div class="card-header">ファンダメンタル</div><div class="fund-grid">
    <div class="fund-item"><div class="fund-lbl">PER</div><div class="fund-val">${per?per.toFixed(1)+'倍':'—'}</div></div>
    <div class="fund-item"><div class="fund-lbl">PBR</div><div class="fund-val">${pbr?pbr.toFixed(2)+'倍':'—'}</div></div>
    <div class="fund-item"><div class="fund-lbl">EPS</div><div class="fund-val">${eps?fmtN(eps)+'円':'—'}</div></div>
    <div class="fund-item"><div class="fund-lbl">ROE</div><div class="fund-val">${roe?(roe*100).toFixed(1)+'%':'—'}</div></div>
    <div class="fund-item"><div class="fund-lbl">配当利回り</div><div class="fund-val">${dy?(dy*100).toFixed(2)+'%':'—'}</div></div>
    <div class="fund-item"><div class="fund-lbl">次回決算</div><div class="fund-val" style="font-size:13px">${d.earningsDate||'—'}</div></div>
  </div>`; ap(fc);

  setTimeout(() => drawCharts(d, 'daily'), 60);
}

function poBox(lbl, po) {
  if(!po) return `<div class="po-box"><div class="lbl">${lbl}</div><div class="po-num">—</div></div>`;
  const s=po.score, cls=s===5?'b-perfect':s>=4?'b-good':s>=3?'b-mid':'b-low';
  const badge=s===5?'🎯 完璧！':s>=4?'↑ 強気':s>=3?'△ 中立':'↓ 弱気';
  return `<div class="po-box"><div class="lbl">${lbl}</div><div><span class="po-num">${s}</span><span class="po-denom">/5</span></div><div class="po-badge ${cls}">${badge}</div></div>`;
}

function pairsHtml(po) {
  if(!po?.pairs) return '<div style="color:var(--t3);padding:8px">データなし</div>';
  return po.pairs.map(p=>{
    const icon = p.ok===null?'—':p.ok?'✅':'❌';
    return `<div class="pair-row"><div class="pair-lbl">${p.label.replace('MA','MA ')}</div><div class="pair-vals">${p.va?fmtN(p.va):'—'} / ${p.vb?fmtN(p.vb):'—'}</div><div class="pair-icon">${icon}</div></div>`;
  }).join('');
}

function switchCT(btn) {
  document.querySelectorAll('.ct').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  currentCType = btn.dataset.t;
  if(currentData) drawCharts(currentData, currentCType);
}

function drawCharts(d, type) {
  const rows = type==='weekly' ? d.weekly : d.daily;
  const closes = rows.map(r=>r.c);
  const labels = rows.map(r=>r.date);

  // MA legend
  const leg=document.getElementById('maLeg');
  if(leg) leg.innerHTML = MA_PERIODS.map(p=>`<div class="ma-li"><div class="ma-dot" style="background:${MA_COLORS[p]}"></div>MA${p}</div>`).join('');

  // Main chart
  if(chartInst) chartInst.destroy();
  const ctx=document.getElementById('mainC');
  if(!ctx) return;
  const ds=[{label:'終値',data:closes,borderColor:'#1C1C1E',borderWidth:1.5,pointRadius:0,tension:0,fill:false,order:10}];
  MA_PERIODS.forEach(p=>{
    const ma=calcMA(closes,p);
    ds.push({label:`MA${p}`,data:ma,borderColor:MA_COLORS[p],borderWidth:1.5,pointRadius:0,tension:0,fill:false});
  });
  chartInst=new Chart(ctx,{type:'line',data:{labels,datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,animation:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false}},
    scales:{x:{ticks:{maxTicksLimit:6,font:{size:10}},grid:{display:false}},
            y:{position:'right',ticks:{maxTicksLimit:5,font:{size:10},callback:v=>fmtN(v)},grid:{color:'#F0F0F0'}}}
  }});

  // RSI
  if(rsiInst) rsiInst.destroy();
  const rc=document.getElementById('rsiC');
  if(rc){
    if(type==='daily'){
      rc.parentElement.style.display='block';
      rsiInst=new Chart(rc,{type:'line',data:{labels,datasets:[{label:'RSI',data:d.rsi,borderColor:'#5856D6',borderWidth:1.5,pointRadius:0,tension:0,fill:false}]},options:{
        responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{display:false}},
        scales:{x:{ticks:{maxTicksLimit:6,font:{size:9}},grid:{display:false}},
                y:{position:'right',min:0,max:100,ticks:{stepSize:20,font:{size:9}},
                   grid:{color:c=>(c.tick.value===30||c.tick.value===70)?'#FF950080':'#F0F0F0'}}}
      }});
    } else { rc.parentElement.style.display='none'; }
  }

  // MACD
  if(macdInst) macdInst.destroy();
  const mc=document.getElementById('macdC');
  if(mc){
    if(type==='daily'){
      mc.parentElement.style.display='block';
      macdInst=new Chart(mc,{type:'bar',data:{labels,datasets:[
        {label:'MACD',data:d.macd,borderColor:'#007AFF',borderWidth:1.5,type:'line',pointRadius:0,tension:0,fill:false,order:1},
        {label:'Signal',data:d.signal,borderColor:'#FF3B30',borderWidth:1.5,type:'line',pointRadius:0,tension:0,fill:false,order:2},
        {label:'Hist',data:d.hist,backgroundColor:d.hist.map(v=>v>=0?'rgba(52,199,89,.5)':'rgba(255,59,48,.5)'),order:3}
      ]},options:{
        responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{display:false}},
        scales:{x:{ticks:{maxTicksLimit:6,font:{size:9}},grid:{display:false}},
                y:{position:'right',ticks:{maxTicksLimit:4,font:{size:9}},grid:{color:'#F0F0F0'}}}
      }});
    } else { mc.parentElement.style.display='none'; }
  }
}

// ── ウォッチリスト ────────────────────────────────────────
async function quickScore(code) {
  const sym = /^\d{4,}$/.test(code) ? code+'.T' : code;
  const [w,m] = await Promise.all([fetchChart(sym,'1wk','5y'), fetchChart(sym,'1mo','15y')]);
  const n = await fetchName(sym).catch(()=>code);
  const wp=perfectOrder(w), mp=perfectOrder(m);
  return {code, name:n, weekly_score:wp.score, monthly_score:mp.score, price:wp.price};
}

function renderWL(){
  const el=document.getElementById('wlList');
  if(!watchlist.length){el.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><p>銘柄を追加してください</p></div>';return;}
  el.innerHTML=watchlist.map((w,i)=>{
    const ws=w.weekly_score??'?', ms=w.monthly_score??'?';
    return `<div class="wl-item">
      <div class="wl-code">${w.code}</div>
      <div class="wl-name">${w.name||w.code}</div>
      <div class="wl-scores">
        <span class="score-chip s${ws}">週${ws}</span>
        <span class="score-chip s${ms}">月${ms}</span>
        <button class="wl-go" onclick="jumpAnalyze('${w.code}')">分析</button>
        <button class="wl-del" onclick="wlDel(${i})">×</button>
      </div>
    </div>`;
  }).join('');
}

async function wlAdd(){
  const code=document.getElementById('wlInp').value.trim().toUpperCase();
  if(!code) return;
  if(watchlist.find(w=>w.code===code)) return;
  watchlist.push({code, name:code});
  saveWL(); renderWL();
  document.getElementById('wlInp').value='';
  // バックグラウンドでスコア取得
  quickScore(code).then(r=>{
    const i=watchlist.findIndex(w=>w.code===code);
    if(i>=0){Object.assign(watchlist[i],r);saveWL();renderWL();}
  }).catch(()=>{});
}

function wlDel(i){watchlist.splice(i,1);saveWL();renderWL();}
function saveWL(){localStorage.setItem('kab_watch2',JSON.stringify(watchlist));}

async function wlRefreshAll(){
  if(!watchlist.length) return;
  document.getElementById('wlList').innerHTML='<div class="loading"><div class="spin"></div><span>更新中...</span></div>';
  await Promise.allSettled(watchlist.map(async(w,i)=>{
    const r=await quickScore(w.code).catch(()=>null);
    if(r) Object.assign(watchlist[i],r);
  }));
  saveWL(); renderWL();
}

function jumpAnalyze(code){
  document.getElementById('codeInp').value=code;
  document.querySelector('[data-tab="analyze"]').click();
  doAnalyze(code);
}

async function doScreen(){
  const minW=+document.getElementById('scW').value;
  const minM=+document.getElementById('scM').value;
  const el=document.getElementById('screenResult');
  const total=SCREEN_CODES.length;
  let done=0;
  const updProg=()=>{ el.innerHTML<`<div class="loading"><div class="spin"></div><span>スキャン中... ${done}/${total}銘柄</span></div>`; };
  updProg();
  const results=[];
  // 10件ずつ並列処理
  for(let i=0;i<SCREEN_CODES.length;i+=10){
    const batch=SCREEN_CODES.slice(i,i+10);
    await Promise.allSettled(batch.map(async code=>{
      try{
        const sym=code+'.T';
        const [w,m]= await Promise.all([fetchChart(sym,'1wk','5y'),fetchChart(sym,'1mo','15y')]);
        const wp=perfectOrder(w), mp=perfectOrder(m);
        if(wp.score>=minW || mp.score>=minM){
          const n=await fetchName(sym).catch(()=>code);
          results.push({code,name:n,ws:wp.score,ms:mp.score,price:wp.price});
        }
      }catch(e){}
      done++; updProg();
    }));
  }
  results.sort((a,b)=>b.ws+b.ms - a.ws-a.ms);
  if(!results.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><p>条件に合う銘柄なし</p></div>'; return;
  }
  el.innerHTML=results.map(r=>`<div class="sc-item" onclick="jumpAnalyze('${r.code}')">
    <div class="sc-code">${r.code}</div>
    <div class="sc-name">${r.name}</div>
    <div class="sc-scores" style="display:flex;gap:5px">
      <span class="score-chip s${r.ws}">週${r.ws}</span>
      <span class="score-chip s${r.ms}">月${r.ms}</span>
    </div>
  </div>`).join('');
}

// ── タブ / ユーティリティ ─────────────────────────────────
function switchTab(btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+btn.dataset.tab).classList.add('active');
  document.getElementById('navTitle').textContent={analyze:'ウォッチリスデ',watch:'ウォッチリスト',screen:'スクリーナー'}[btn.dataset.tab];
}
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function fmtN(v){
  if(v==null||isNaN(v)) return '—';
  const n=Number(v);
  return n>=1000 ? n.toLocaleString('ja-JP',{maximumFractionDigits:0}) : n.toFixed(n>=10?1:2);
}

document.getElementById('codeInp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doAnalyze();}});
document.getElementById('wlInp').addEventListener('keydown',e=>{if(e.key==='Enter') wlAdd();});
renderWL();
</script>
